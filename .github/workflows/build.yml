name: Kernel Build Process
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      variant:
        required: false
        type: string
      feature_set:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
      susfs_commit:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git cpio bcachefs-tools libssl-dev

    - name: Sync Repo
      run: |
        mkdir kernel_workspace && cd kernel_workspace
        repo init -u https://googlesource.com -b android-gs-pixel-6.1
        repo sync -j$(nproc)

    - name: SUSFS
      if: contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'FULL'
      run: |
        echo "Applying SUSFS patches..."

    - name: Setup NoMount
      run: |
        cd kernel_workspace/kernel/common
        git clone https://github.com
        cp -r nomount/kernel/nomount fs/
        git apply nomount/kernel/patches/android-6.1.patch
        echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/gki_defconfig

    - name: Baseband Guard
      if: (contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'FULL')
      run: |
        echo "Applying Baseband Guard..."

    - name: Compile Kernel
      run: |
        cd kernel_workspace
        BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
